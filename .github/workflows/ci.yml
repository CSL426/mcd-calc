name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 型別檢查、測試、打包
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 版本讀 package.json 的 packageManager 欄位
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  image:
    name: Build 並推送 image 到 ghcr.io
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      # ghcr 的 image 名稱只能小寫，github.repository 是 CSL426/mcd-calc
      IMAGE: ghcr.io/csl426/mcd-calc
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 只推一份單純的 manifest，digest 就是 Cloud Run 要拉的那個 image
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: 部署到 Cloud Run
    needs: image
    # GCP 還沒設定好（沒有 repo variables）之前跳過，不讓 CI 變紅
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-cloud-run
      cancel-in-progress: false
    env:
      REGION: asia-east1
      SERVICE: mcd-calc
    steps:
      # Workload Identity Federation：不在 GitHub 存任何 GCP 金鑰
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}
      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          # 用 digest 部署，確保跑的就是這次 build 的那一份；ghcr.io 公開 image 可直接拉
          image: ghcr.io/csl426/mcd-calc@${{ needs.image.outputs.digest }}
          # 沒人用縮到 0 不收錢；最多 1 個，被灌流量時費用有上限
          flags: --port=80 --min-instances=0 --max-instances=1 --allow-unauthenticated
      - name: 健康檢查
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ steps.deploy.outputs.url }}/healthz"
      - name: 摘要
        run: echo "已部署到 ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
